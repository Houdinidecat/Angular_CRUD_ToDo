<app-navigation />
<main class="workspace">
  <header class="page-heading">
    <p class="eyebrow">PROYECTO ANGULAR · CRUD</p>
    <h1>Gestor de tareas</h1>
    <p class="introduction">
      Una idea, una tarea. Agrega lo que necesitas hacer y mantén tu lista en orden.
    </p>
  </header>
  <div class="workspace-grid">
    <app-task-form [task]="selectedTask()" (saved)="saveTask($event)" (cancelled)="cancelEdit()" />
    <app-task-list
      [tasks]="taskService.tasks()"
      [editingId]="selectedTask()?.id ?? null"
      (edit)="editTask($event)"
      (remove)="deleteTask($event)"
    />
  </div>
  <p class="feedback" role="status" aria-live="polite">{{ message() }}</p>
  <footer class="workspace-footer">
    <span>Crear · Leer · Actualizar · Eliminar</span>
    <span>Las tareas se reinician al recargar la página.</span>
  </footer>
</main>
